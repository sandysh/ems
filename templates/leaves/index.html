{% extends "shared/base.html" %}
{% block content%}
    {% if request.user.is_superuser %}
        <admin-leaves-index></admin-leaves-index>
    {% elif request.user.groups.all|length > 0 and "supervisor" in request.user.groups.all.0.name %}
        <supervisor-leaves-index></supervisor-leaves-index>
    {% else %}
        <leaves-index></leaves-index>
    {% endif %}
{% endblock %}
